server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend's private address changes when it redeploys, so it is looked up again every few seconds.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Uploads are capped at 5 MB by the API; the extra headroom covers the multipart envelope.
    client_max_body_size 6m;

    # Course files (videos, audio, documents) are large. They go through unbuffered with a bigger limit and time to finish;
    # keep client_max_body_size above STW_TRAINING_MAX_MB. The location repeats the proxy settings because it replaces /api/ for these requests.
    location ~ ^/api/training/lessons/[0-9]+/media$ {
        client_max_body_size 520m;
        proxy_request_buffering off;
        set $backend "http://${BACKEND_ADDR}";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Playback streams straight through, so a video starts at once and nothing is parked on the disk; seeking uses range requests.
    location ^~ /api/training/media/ {
        proxy_buffering off;
        set $backend "http://${BACKEND_ADDR}";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /api/ {
        set $backend "http://${BACKEND_ADDR}";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # `expires` rather than add_header: a location-level add_header would drop the security headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
